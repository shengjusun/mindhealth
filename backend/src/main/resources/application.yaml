spring:
  application:
    name: mindhealth-backend
  datasource:
    url: jdbc:mysql://localhost:3306/mindhealth?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: 111111
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 0
      location: ${java.io.tmpdir}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mindhealth.backend.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 9000
  servlet:
    context-path: /api

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.security: DEBUG

jwt:
  secret: REMOVED
  expire: 86400
  refresh-expire: 604800

# 文件上传配置
file:
  upload:
    path: uploads/avatars/
    max-size: 5MB
    allowed-types: jpg,jpeg,png,webp