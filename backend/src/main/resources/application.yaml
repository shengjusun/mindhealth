spring:
  application:
    name: mindhealth-backend
  profiles:
    # local 配置文件（application-local.yaml）存放华为登录密钥等私有信息，不进 git
    active: local
  datasource:
    url: jdbc:mysql://localhost:3306/mindhealth?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: localhost
      port: 6379
      password: ""
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB
      file-size-threshold: 0
      location: ${java.io.tmpdir}

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.mindhealth.backend.entity
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

server:
  port: 9000
  servlet:
    context-path: /api

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  level:
    org.springframework.security: INFO

jwt:
  secret: ${JWT_SECRET:REMOVED}
  expire: 86400
  refresh-expire: 604800

# 华为账号登录（Account Kit），生产环境必须通过环境变量注入
huawei:
  client-id: ${HUAWEI_CLIENT_ID:}
  client-secret: ${HUAWEI_CLIENT_SECRET:}
  token-url: https://oauth-login.cloud.huawei.com/oauth2/v3/token

# DeepSeek AI 聊天（后端直连，替代 AGC 云函数中转），api-key 通过环境变量或 local 配置注入
deepseek:
  api-url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
  api-key: ${DEEPSEEK_API_KEY:}
  model: ${DEEPSEEK_MODEL:deepseek-chat}
  timeout-ms: 60000

# 文件上传配置
file:
  upload:
    path: uploads/avatars/
    max-size: 5MB
    allowed-types: jpg,jpeg,png,webp