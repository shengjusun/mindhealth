# MindHealth 管理后台：Vue 构建产物 + /api 反向代理到后端 9000
# 用法：放入 nginx conf.d，按需修改 listen / server_name / root，然后 nginx -s reload
server {
    listen       8080;
    server_name  localhost;

    # 对应 admin/dist
    root   D:/harmony/Project/mh/admin/dist;
    index  index.html;

    charset utf-8;
    client_max_body_size 10m;

    # 带 hash 的构建产物可长缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # history 模式：刷新子路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 关键：后端 context-path 已经是 /api，proxy_pass 末尾绝对不能带斜杠（否则会吃掉 /api 前缀）
    # 正确：proxy_pass http://127.0.0.1:9000;
    # 错误：proxy_pass http://127.0.0.1:9000/;
    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}